[versions]
kotlin = "2.2.20"
coroutines = "1.10.2"
serialization = "1.9.0"
ktor = "3.2.3"
koog = "1.1.1"

[libraries]
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-agents-mcp = { module = "ai.koog:agents-mcp", version = "1.1.1-beta" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version = "2.0.17" }
mordant = { module = "com.github.ajalt.mordant:mordant", version = "3.0.2" }
mordant-markdown = { module = "com.github.ajalt.mordant:mordant-markdown", version = "3.0.2" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
